[project]
name = "surfacescanner"
version = "0.1.0"
description = "APT-style intelligence gathering engine and EASM platform"
requires-python = ">=3.12"
# Only what the shipped phases (lookalike, subdomain) and the operator console
# actually import. Everything else belongs to a phase that is not promoted yet,
# so it lives in an optional extra below and is installed on demand. This keeps
# the base install small, auditable and free of the AI stack, which has no place
# in the scanning flow.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "dnspython>=2.6",
    "python-dotenv>=1.0",
    "structlog>=24.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Screenshot and perceptual hash enrichment (semi/active only).
screenshots = ["playwright>=1.44"]
# HTML parsing for the http enrichers.
html = ["beautifulsoup4>=4.12", "lxml>=5.2"]
# Shodan backed favicon correlation (layer2_5).
shodan = ["shodan>=1.31"]
# PDF and markdown report rendering.
report = ["weasyprint>=68.1", "markdown>=3.10.2", "pypdf>=4.2"]
# Document metadata extraction (office files, EXIF).
docmeta = ["python-docx>=1.1", "olefile>=0.47", "pyexiftool>=0.5"]
# WHOIS and richer recon helpers.
recon = ["python-whois>=0.9"]
# CLI niceties used by the full engine entry point.
cli = ["rich>=13.7", "typer>=0.12", "tenacity>=8.3"]
# Datastores for not-yet-promoted phases (corporate intel, kill chain).
store = ["asyncpg>=0.29", "psycopg2-binary>=2.9", "sqlalchemy>=2.0", "neo4j>=5.20",
         "chromadb>=0.5", "cryptography>=50.0.2"]
# AI stack for future phases only. Never imported by the scanning flow.
ai = ["ollama>=0.2", "openai>=1.30", "langgraph>=0.2", "langchain-core>=0.3"]

[project.scripts]
surfacescanner = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "layer0", "layer1", "layer2", "layer2_5", "layer3", "layer4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
